<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go-dyno report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  --div-neg: #2a78d6; --div-mid: #f0efec; --div-pos: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-text: #0ca30c; --div-neg: #3987e5; --div-mid: #383835; --div-pos: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-text: #0ca30c; --div-neg: #3987e5; --div-mid: #383835; --div-pos: #e66767;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 22px; margin: 0 0 2px; }
header p { margin: 0; color: var(--ink-2); }
h2 { font-size: 17px; margin: 36px 0 8px; }
h3 { font-size: 14px; margin: 20px 0 6px; color: var(--ink-2); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; margin: 10px 0; overflow: hidden; }
.note { color: var(--ink-2); margin: 4px 0 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 0; border-bottom: 1px solid var(--grid); }
.bar label { color: var(--ink-2); }
select, input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
nav a { color: var(--ink-2); margin-right: 12px; text-decoration: none; white-space: nowrap; }
nav a:hover { color: var(--ink); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; }
td.fn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
.status { white-space: nowrap; }
.status i { font-style: normal; display: inline-block; width: 1.1em; text-align: center; font-weight: 700; }
.st-pass i { color: var(--good); } .st-warn i { color: var(--warning); } .st-fail i { color: var(--critical); } .st-skip i { color: var(--muted); }
.grade { display: inline-block; min-width: 26px; text-align: center; border-radius: 6px; font-weight: 700; padding: 0 6px; color: #fff; }
.g-A { background: var(--good); } .g-B { background: var(--s1); } .g-C { background: var(--warning); color: #0b0b0b; } .g-F { background: var(--critical); }
details summary { cursor: pointer; }
.empty { color: var(--muted); font-style: italic; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); max-width: 420px; display: none; }
.tip b { font-weight: 600; }
svg text { fill: var(--ink-2); font-size: 11px; }
svg .axis { stroke: var(--axis); } svg .gridl { stroke: var(--grid); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin: 4px 0; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.legend span.dash::before { height: 0; border-top: 2px dashed var(--c); background: none; }
.flame { position: relative; width: 100%; user-select: none; }
.flame div { position: absolute; height: 17px; font-size: 11px; line-height: 17px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #fff; border-radius: 2px; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.flame div.hit { outline: 2px solid var(--ink); outline-offset: -2px; }
.flame div.dim { opacity: .35; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kv div { background: var(--page); border-radius: 8px; padding: 10px; }
.kv b { display: block; font-size: 18px; }
.kv span { color: var(--ink-2); font-size: 12px; }
ul.find { margin: 6px 0; padding-left: 18px; } ul.find li { margin: 4px 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p id="sub"></p></header>
  <div class="bar">
    <label for="sc">Scenario</label><select id="sc"></select>
    <nav id="nav"></nav>
  </div>
  <section id="trust"></section>
  <section id="cpu"></section>
  <section id="scen"></section>
  <section id="redline"></section>
  <section id="compare"></section>
</main>
<div class="tip" id="tip"></div>

const fnTable = (rows, valHead, val) => table(["function", valHead, "cum"], rows.map(f => [el("span", { class: "fn" }, f.function), val(f.flat), val(f.cum)]), [1, 2]);

// ---------- charts
function hbars(rows, { fmt = num, unit = "", color = slot(0) } = {}) {

  rows.forEach((r, i) => {

    s.append(sv("line", { x1: x(a.min), x2: x(a.max), y1: y + 10, y2: y + 10, stroke: css("--ink"), "stroke-width": 1.5 }));

function lines(series, { xLabel = "", yLabel = "", logY = false, hline = null, diag = false, fmtY = num, fmtX = num } = {}) {

  const W = 640, H = 240, L = 54, R = 16, T = 10, B = 34;

// ---------- sections
function renderTrust() {
  const s = $("#trust"); s.innerHTML = "";
  s.append(el("h2", { id: "t-trust" }, "Measurement trust"));
  s.append(el("p", { class: "note" }, "Each run is graded by its validity checks. Failed runs stay on disk but are left out of every number below."));
  const rows = D.runs.map(r => [r.id, el("span", { class: "grade g-" + r.grade, title: "score " + r.score }, r.grade || "?"), r.label || "—", r.sha || "—",

function renderCPU() {
  const s = $("#cpu"); s.innerHTML = "";
  s.append(el("h2", { id: "t-cpu" }, "CPU per request"));
  s.append(el("p", { class: "note" }, "OS-measured CPU in the capture window ÷ requests in the same window. Bar: median over passing runs; whisker: min–max."));
  const procs = [...new Set(D.scenarios.flatMap(x => x.procs.map(p => p.name)))];
  procs.forEach((p, i) => {
    const rows = D.scenarios.map(sc => ({ label: sc.name, agg: (sc.procs.find(x => x.name === p) || {}).cpu_us || {} }));
    s.append(el("div", { class: "card" }, el("h3", {}, `${p}: µs of CPU per request`), hbars(rows, { unit: " µs", color: slot(i) }),
      el("details", {}, el("summary", {}, "table"), table(["scenario", "CPU µs/request", "bytes/request", "GC share", "CPU utilisation"], D.scenarios.map(sc => { const x = sc.procs.find(q => q.name === p) || {}; return [sc.name, agg(x.cpu_us), agg(x.alloc_b, bytes), agg(x.gc_share, v => pct(v)), agg(x.util, v => pct(v, 0))]; })))));
  });
}

function renderScenario(name) {
  const s = $("#scen"); s.innerHTML = "";
  const sc = D.scenarios.find(x => x.name === name);
  if (!sc) return;
  s.append(el("h2", { id: "t-scen" }, `Scenario ${sc.name}`));
  s.append(el("p", { class: "note" }, `${sc.passing} of ${sc.total} runs passed; warm-up of ${sc.warmup}s excluded.`));
  s.append(el("div", { class: "card" }, table(["check", "status", "detail"], sc.checks.map(c => [c.name, status(c.status), c.detail]))));

  s.append(el("h3", { id: "t-lat" }, "Latency (successful requests after warm-up, all passing runs)"));
  s.append(el("div", { class: "card" }, table(["route", "requests", "p50 ms", "p95 ms", "p99 ms", "errors"], sc.latency.map(l => [l.route === "*" ? "all routes" : l.route, l.n, num(l.p50), num(l.p95), num(l.p99), pct(l.error_rate, 2)]), [1, 2, 3, 4, 5])));

  for (const p of sc.procs) {
    s.append(el("h3", { id: "t-p-" + p.name }, `${p.name}: where the CPU goes`));
    const c = el("div", { class: "card" });
    c.append(el("div", { class: "kv" },
      el("div", {}, el("b", {}, num(p.cpu_us.median) + " µs"), el("span", {}, "CPU per request")),
      el("div", {}, el("b", {}, bytes(p.alloc_b.median || 0)), el("span", {}, "allocated per request")),
      el("div", {}, el("b", {}, pct(p.gc_share.median || 0)), el("span", {}, "of CPU in GC")),
      el("div", {}, el("b", {}, (p.slope_goroutines >= 0 ? "+" : "") + num(p.slope_goroutines)), el("span", {}, "goroutines per minute")),
      el("div", {}, el("b", {}, (p.slope_heap_mib >= 0 ? "+" : "") + num(p.slope_heap_mib) + " MiB"), el("span", {}, "heap in use per minute"))));
    if (p.flame) { c.append(el("h3", {}, "Flame graph (all passing runs merged)")); c.append(flame(p.flame)); }
    else c.append(el("p", { class: "empty" }, "no CPU profile"));
    if (p.top && p.top.length) { c.append(el("h3", {}, "Top functions by own CPU (share of the process's CPU)")); c.append(fnTable(p.top, "flat", v => pct(v))); }
    if (p.focus && p.focus.length) { c.append(el("h3", {}, "Code paths (configured focus)")); c.append(table(["label", "share of CPU"], p.focus.map(f => [f.label, agg(f.share, v => pct(v))]))); }
    s.append(c);

    const a = el("div", { class: "card" });
    a.append(el("h3", {}, `${p.name}: allocation`));
    if (p.top_alloc && p.top_alloc.length) a.append(fnTable(p.top_alloc, "flat", v => pct(v))); else a.append(el("p", { class: "empty" }, "no allocation profile"));
    s.append(a);

    const l = el("div", { class: "card" });
    l.append(el("h3", {}, `${p.name}: leak check (one line per run; constant load should give flat lines after warm-up)`));
    if (p.leak && p.leak.length) {
      const col = slot(p.slot);
      l.append(lines(p.leak.map(r => ({ name: r.run, color: col, opacity: .7, points: r.points.map(q => [q[0], q[1]]) })), { xLabel: "seconds since load start", yLabel: "goroutines", fmtX: v => v.toFixed(0) }));
      l.append(lines(p.leak.map(r => ({ name: r.run, color: col, opacity: .7, points: r.points.map(q => [q[0], q[2]]) })), { xLabel: "seconds since load start", yLabel: "heap in use (MiB)", fmtX: v => v.toFixed(0) }));
    } else l.append(el("p", { class: "empty" }, "no runtime samples"));
    if (p.growth && p.growth.length) { l.append(el("h3", {}, "Heap growth by allocation site (last snapshot − first after warm-up)")); l.append(table(["function", "in-use bytes change"], p.growth.map(g => [el("span", { class: "fn" }, g.function), bytes(g.bytes)]), [1])); }
    if (p.goroutines && p.goroutines.length) { l.append(el("h3", {}, "Goroutines by state and top frames (last run's dump)")); l.append(table(["count", "state", "top frames"], p.goroutines.map(g => [g.Count, g.State, el("span", { class: "fn" }, g.Top)]), [0])); }
    s.append(l);
  }
}

function renderRedline() {
  const s = $("#redline"); s.innerHTML = "";
  if (!D.redline || !D.redline.length) return;
  s.append(el("h2", { id: "t-redline" }, "Redline"));
  for (const r of D.redline) {
    const c = el("div", { class: "card" });
    c.append(el("h3", {}, `${r.scenario}: knee at ${num(r.knee, 0)} req/s`));
    c.append(el("p", { class: "note" }, "Limits: " + r.limits));
    c.append(el("ul", { class: "find" }, r.diagnosis.map(f => el("li", {}, el("b", {}, f.kind.replace("_", " ") + ": "), f.detail, f.evidence ? el("div", { class: "note" }, el("code", {}, f.evidence)) : null))));
    const st = r.steps;
    const served = st.some(x => x.served > 0);
    c.append(legend([{ name: "successful (client)", color: slot(0) }, ...(served ? [{ name: "completed (server count)", color: slot(1) }] : []), { name: "target", color: css("--muted"), dash: true }]));
    c.append(lines([{ name: "successful (client)", color: slot(0), markers: true, points: st.map(x => [x.rate, x.achieved]) }, ...(served ? [{ name: "completed (server)", color: slot(1), markers: true, points: st.map(x => [x.rate, x.served]) }] : [])], { xLabel: "target req/s", yLabel: "throughput req/s", diag: true, fmtX: v => v.toFixed(0) }));
    c.append(legend([{ name: "p99 latency", color: slot(0) }, { name: "limit", color: css("--critical"), dash: true }]));
    const lim = r.p99_limit_ms;
    c.append(lines([{ name: "p99 ms", color: slot(0), markers: true, points: st.map(x => [x.rate, x.p99_ms]) }], { xLabel: "target req/s", yLabel: "p99 ms (log)", logY: true, hline: lim || null, fmtX: v => v.toFixed(0) }));
    const procs = [...new Set(st.flatMap(x => Object.keys(x.procs || {})))];
    c.append(table(["target", "successful", "server completed", "p50 ms", "p99 ms", "errors", ...procs.map(p => p + " cores"), "result"],
      st.map(x => [num(x.rate, 0), num(x.achieved, 0), x.served ? num(x.served, 0) : "—", num(x.p50_ms), num(x.p99_ms), pct(x.error_rate, 2), ...procs.map(p => x.procs[p] ? num(x.procs[p].cpu_cores) : "—"), x.pass ? status("pass") : el("span", {}, status("fail"), " " + x.reason)]), [0, 1, 2, 3, 4, 5]));
    s.append(c);
  }
}

function renderCompare() {
  const s = $("#compare"); s.innerHTML = "";
  const C = D.compare; if (!C) return;
  s.append(el("h2", { id: "t-compare" }, C.regressed ? "Compare: regression" : "Compare: no regression"));
  s.append(el("p", { class: "note" }, `Base ${C.base} vs head ${C.head}. A change counts only when it exceeds the threshold and half the run-to-run spread.`));
  if (C.warnings && C.warnings.length) s.append(el("div", { class: "card" }, el("p", {}, status("warn"), " Base and head were measured under different conditions, so differences may not come from the code:"), el("ul", { class: "find" }, C.warnings.map(w => el("li", {}, w)))));
  const V = { regressed: "fail", improved: "pass", same: "skip" };
  s.append(el("div", { class: "card" }, table(["scenario", "process", "metric", "base", "head", "change", "allowed", "verdict"],
    C.metrics.filter(m => m.verdict !== "n/a").map(m => [m.scenario, m.process || "—", m.name, num(m.base.median) + " " + m.unit, num(m.head.median) + " " + m.unit, (m.change >= 0 ? "+" : "") + pct(m.change), "±" + pct(m.allowed), el("span", { class: "status st-" + V[m.verdict] }, el("i", {}, ST[V[m.verdict]]), " " + m.verdict)]), [3, 4, 5, 6])));
  for (const d of D.diffs || []) {
    s.append(el("div", { class: "card" }, el("h3", {}, `Flame graph diff: ${d.scenario} / ${d.process} (width = head share; color = change vs base)`), flame(d.tree, { diff: true })));
  }
  if (C.functions && C.functions.length) s.append(el("div", { class: "card" }, el("h3", {}, "Largest changes in CPU share by function"),
    table(["scenario", "process", "function", "base", "head"], C.functions.map(f => [f.scenario, f.process, el("span", { class: "fn" }, f.function), pct(f.base), pct(f.head)]), [3, 4])));
}

function nav() {
  const n = $("#nav"); n.innerHTML = "";
  const links = [["t-trust", "Trust"], ["t-cpu", "CPU/request"], ["t-scen", "Scenario"], ["t-redline", "Redline"], ["t-compare", "Compare"]];
  for (const [id, t] of links) if (document.getElementById(id)) n.append(el("a", { href: "#" + id }, t));
}

function init() {
  $("#title").textContent = D.title + " · go-dyno";
  $("#sub").textContent = `${D.host || ""} · generated ${D.generated}`;
  const sel = $("#sc");
  for (const sc of D.scenarios) sel.append(el("option", { value: sc.name }, sc.name));
  let saved = null; try { saved = localStorage.getItem("dyno-scenario"); } catch (e) { }
  if (saved && D.scenarios.some(x => x.name === saved)) sel.value = saved;
  sel.addEventListener("change", () => { try { localStorage.setItem("dyno-scenario", sel.value); } catch (e) { } renderScenario(sel.value); nav(); });
  renderTrust(); renderCPU(); renderScenario(sel.value); renderRedline(); renderCompare(); nav();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderCPU(); renderScenario(sel.value); renderRedline(); renderCompare(); });
}
init();
</script>
</body>
</html>
